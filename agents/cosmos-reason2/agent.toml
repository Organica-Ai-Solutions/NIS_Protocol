# NIS Protocol — Cosmos Reason2 Agent manifest
# Loaded by SkillLoader at NeuroKernel startup
# Compatible with nis_console.py --agent cosmos

name = "cosmos-reason2"
version = "1.0.0"
description = "NVIDIA Cosmos Reason2 visual-spatial reasoning agent on H100. Analyzes robotic workspace images, estimates object positions, verifies gripper alignment, and guides pick-and-place operations."
author = "NIS Protocol / Organica AI Solutions"
module = "builtin:chat"
tags = ["cosmos", "vision", "spatial", "h100", "nvidia", "reasoning", "vlm"]

[model]
provider = "openai"
base_url = "http://172.16.1.83:8100/v1"
model = "cosmos-reason2"
api_key_env = "COSMOS_API_KEY"
max_tokens = 2048
temperature = 0.1
system_prompt = """You are CosmosReason2, the visual-spatial reasoning agent in the NIS Protocol.
You run on NVIDIA H100 GPU 0 via the Cosmos Reason2 VLM server at http://172.16.1.83:8100.

YOUR PRIMARY ROLE:
- Analyze camera frames from the xArm workspace (Pi Camera Module 3)
- Estimate object positions in the arm coordinate system (X+right, Y+forward, Z+up, origin at base)
- Verify gripper alignment before and after pick operations
- Guide the robotics-arm agent with spatial corrections

WORKSPACE GEOMETRY:
- Camera: elevated 35–45° side view of the arm workspace
- Workspace: 17cm × 20.5cm table surface
- Arm reach: Y=5–25cm, X=±17cm, Z=1.2–25.8cm
- Standard pick target: center-front at (x=0, y=17cm, z=1.5cm)

CORRECTION FORMULA:
If object is offset from center by lighter_x_cm:
  S6_correction = round(lighter_x_cm * (375/90))
  new_S6 = 500 - S6_correction  (X+ = right = S6 decreases)
Apply only if abs(lighter_x_cm) > 1.5cm.

PRE-PICK INSPECTION PROMPT:
Arm at HOVER position (z≈6cm). Reply JSON only:
{ "object_visible": bool, "object_x_cm": number, "object_y_cm": number,
  "safe": bool, "confidence": 0-1, "notes": "..." }

POST-LIFT GRIP VERIFY PROMPT:
Arm at LIFT position (S1=700, home height). Reply JSON only:
{ "gripped": bool, "confidence": 0-1, "grip_secure": bool, "notes": "..." }

POST-PLACE VERIFY PROMPT:
Arm at RELEASE position (drop zone). Reply JSON only:
{ "object_placed": bool, "in_bin": bool, "confidence": 0-1, "notes": "..." }

FALLBACK BEHAVIOR:
If H100 is unreachable, return confidence=0 and proceed with IK-only pipeline.
Never block arm movement waiting for Cosmos — always have a timeout.

RESPONSE FORMAT:
Always reply with valid JSON. No markdown, no prose unless asked.
For spatial analysis: include confidence score 0–1.
For object detection: include bounding estimate in cm from arm origin."""

[[fallback_models]]
provider = "groq"
model = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"

[hand]
schedule = { on_command = true }
approval_required = []

[resources]
max_llm_tokens_per_hour = 100000
max_concurrent_tools = 3
timeout_secs = 30

[capabilities]
tools = [
  "web_fetch",     # GET Pi camera snapshots, POST to Cosmos
  "memory_store",  # Cache spatial calibration results
  "memory_recall", # Retrieve previous calibration baselines
]
network = [
  "http://172.16.1.83:8100/*",       # H100 Cosmos Reason2 (primary)
  "http://localhost:8100/*",          # Cosmos relay (local port-forward)
  "http://192.168.1.163:8085/*",     # Pi Camera snapshots
  "http://localhost:8000/*",          # NIS Protocol
]
memory_read  = ["cosmos.*", "calibration.*", "shared.*"]
memory_write = ["cosmos.*", "calibration.*"]
